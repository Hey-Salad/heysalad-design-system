<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 28px; background: var(--bg-base); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: start; }
  .stack { display: flex; flex-direction: column; gap: 16px; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { Input, Switch, Checkbox } = window.HeySaladDesignSystem_7c87a6;
    function Demo() {
      const [veg, setVeg] = React.useState(true);
      const [save, setSave] = React.useState(true);
      const [news, setNews] = React.useState(false);
      return (
        <div className="grid">
          <div className="stack">
            <Input label="Email" placeholder="you@heysalad.io" defaultValue="" />
            <Input label="Password" type="password" error="At least 8 characters" defaultValue="abc" />
          </div>
          <div className="stack">
            <Switch checked={veg} onChange={setVeg} label="Vegetarian only" />
            <Switch checked={news} onChange={setNews} label="Weekly recipe email" />
            <Checkbox checked={save} onChange={setSave} label="Save to my list" />
            <Checkbox checked={false} onChange={() => {}} label="Add to shopping cart" />
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
  </script>
</body>
</html>
