<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--bg-base); font-family: var(--font-body); }
  .row { display: flex; gap: 12px; }
  .sw { flex: 1; }
  .chip { height: 70px; border-radius: var(--radius-sm); border: 1px solid var(--line-200); }
  .name { font-weight: 600; font-size: 12.5px; color: var(--text-strong); margin: 8px 0 1px; }
  .hex { font-size: 11.5px; color: var(--text-muted); text-transform: uppercase; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--ink-900)"></div><div class="name">Ink 900</div><div class="hex">#1F1416</div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-700)"></div><div class="name">Ink 700</div><div class="hex">#4A3F41</div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-500)"></div><div class="name">Ink 500</div><div class="hex">#7A6E70</div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-300)"></div><div class="name">Ink 300</div><div class="hex">#B7ADAE</div></div>
    <div class="sw"><div class="chip" style="background:var(--line-200)"></div><div class="name">Line 200</div><div class="hex">#ECE5E5</div></div>
    <div class="sw"><div class="chip" style="background:var(--cream)"></div><div class="name">Cream</div><div class="hex">#FFF8F6</div></div>
  </div>
</body>
</html>
