<!-- @dsCard group="Type" viewport="700x230" name="Figtree — Body & UI" subtitle="The readable workhorse for copy, labels, captions" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 28px; background: var(--bg-base); font-family: var(--font-body); color: var(--text-body); }
  .h3 { font-size: 20px; font-weight: 600; color: var(--text-strong); margin: 0 0 8px; }
  .body { font-size: 16px; line-height: 1.55; max-width: 560px; margin: 0 0 12px; }
  .row { display: flex; gap: 24px; align-items: baseline; }
  .cap { font-size: 13px; color: var(--text-muted); }
  .lbl { font-size: 14px; font-weight: 600; color: var(--text-strong); }
</style>
</head>
<body>
  <p class="h3">Snap your fridge, get dinner</p>
  <p class="body">HeySalad turns what you already have into recipes you'll actually want to cook — no waste, no last-minute store runs. Figtree keeps long copy comfortable at every size.</p>
  <div class="row">
    <span class="lbl">Label · 14px SemiBold</span>
    <span class="cap">Caption · 13px Regular</span>
  </div>
</body>
</html>
