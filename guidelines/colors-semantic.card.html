<!-- @dsCard group="Colors" viewport="700x180" name="Semantic & States" subtitle="Utility colors + cherry interaction states (use sparingly)" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--bg-base); font-family: var(--font-body); }
  .row { display: flex; gap: 14px; }
  .sw { flex: 1; }
  .chip { height: 72px; border-radius: var(--radius-md); border: 1px solid var(--line-200); display:flex; align-items:flex-end; padding:8px; }
  .name { font-weight: 600; font-size: 12.5px; color: var(--text-strong); margin: 8px 0 1px; }
  .hex { font-size: 11.5px; color: var(--text-muted); text-transform: uppercase; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--success-soft)"><span style="width:20px;height:20px;border-radius:6px;background:var(--success)"></span></div><div class="name">Success</div><div class="hex">#3B9C6D</div></div>
    <div class="sw"><div class="chip" style="background:var(--warning-soft)"><span style="width:20px;height:20px;border-radius:6px;background:var(--warning)"></span></div><div class="name">Warning</div><div class="hex">#E0922F</div></div>
    <div class="sw"><div class="chip" style="background:var(--error-soft)"><span style="width:20px;height:20px;border-radius:6px;background:var(--error)"></span></div><div class="name">Error</div><div class="hex">#D83F3F</div></div>
    <div class="sw"><div class="chip" style="background:var(--cherry-red-hover)"></div><div class="name">Cherry Hover</div><div class="hex">#D83F3F</div></div>
    <div class="sw"><div class="chip" style="background:var(--cherry-red-soft)"></div><div class="name">Cherry Soft</div><div class="hex">#FBE4E4</div></div>
  </div>
  <p style="margin:12px 0 0;font-size:12px;color:var(--text-muted)">Success green is pending Peter's decision. Do not add new semantic colours.</p>
</body>
</html>
