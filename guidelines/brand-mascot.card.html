<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 28px; background: var(--cream); font-family: var(--font-body); display: flex; align-items: center; gap: 32px; }
  .sal { width: 140px; height: 140px; flex: none; }
  .txt h3 { font-family: var(--font-display); font-weight: 700; font-size: 24px; color: var(--text-strong); margin: 0 0 6px; }
  .txt p { font-size: 14px; color: var(--text-muted); max-width: 360px; line-height: 1.5; }
</style>
</head>
<body>
  <img class="sal" src="../assets/logos/Sal.png" alt="Sal the tomato-heart mascot" />
  <div class="txt">
    <h3>Meet Sal</h3>
    <p>A tomato-heart with a curious, energetic face. Use Sal as the app icon, loading indicator, and friendly anchor in empty states. Never recolor, rotate, stretch, or add effects.</p>
  </div>
</body>
</html>
