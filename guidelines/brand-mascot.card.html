<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 28px; background: var(--white); font-family: var(--font-body); display: flex; align-items: center; gap: 32px; }
  .sally { width: 140px; height: 140px; flex: none; object-fit: contain; }
  .txt h3 { font-family: var(--font-body); font-weight: 700; font-size: 24px; color: var(--text-strong); margin: 0 0 6px; }
  .txt p { font-size: 14px; color: var(--text-muted); max-width: 380px; line-height: 1.5; }
</style>
</head>
<body>
  <img class="sally" src="../assets/logos/sally-symbol.png" alt="Sally the tomato-heart mascot" />
  <div class="txt">
    <h3>Meet Sally</h3>
    <p>A tomato-heart with a curious, energetic face. Sally is a large illustration on plain white. Never recolor, rotate, stretch, or add effects, and don't animate her in chat UI. Chat avatars use the HeySalad icon.</p>
  </div>
</body>
</html>
