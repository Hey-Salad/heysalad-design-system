<!-- @dsCard group="Spacing" viewport="700x200" name="Elevation & Shadow" subtitle="Soft warm-tinted shadows; cherry glow for primary CTAs" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 32px 28px; background: var(--bg-base); font-family: var(--font-body); }
  .row { display: flex; gap: 28px; }
  .item { text-align: center; }
  .box { width: 96px; height: 64px; background: var(--white); border-radius: var(--radius-md); }
  .lbl { font-size: 12.5px; font-weight: 600; color: var(--text-strong); margin-top: 16px; }
  .glow { background: var(--cherry-red); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="box-shadow:var(--shadow-xs)"></div><div class="lbl">xs</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="lbl">sm</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="lbl">md</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="lbl">lg</div></div>
    <div class="item"><div class="box glow" style="box-shadow:var(--shadow-brand)"></div><div class="lbl">brand glow</div></div>
  </div>
</body>
</html>
