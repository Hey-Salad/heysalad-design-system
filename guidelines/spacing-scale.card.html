<!-- @dsCard group="Spacing" viewport="700x160" name="Spacing Scale" subtitle="4px base — consistent rhythm across layouts" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 28px; background: var(--bg-base); font-family: var(--font-body); }
  .row { display: flex; align-items: flex-end; gap: 18px; }
  .item { text-align: center; }
  .bar { background: var(--peach); border-radius: 4px; width: 100%; }
  .lbl { font-size: 12px; color: var(--text-muted); margin-top: 8px; }
  .val { font-size: 13px; font-weight: 600; color: var(--text-strong); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="bar" style="height:8px;width:8px"></div><div class="val">8</div><div class="lbl">2</div></div>
    <div class="item"><div class="bar" style="height:12px;width:12px"></div><div class="val">12</div><div class="lbl">3</div></div>
    <div class="item"><div class="bar" style="height:16px;width:16px"></div><div class="val">16</div><div class="lbl">4</div></div>
    <div class="item"><div class="bar" style="height:24px;width:24px"></div><div class="val">24</div><div class="lbl">6</div></div>
    <div class="item"><div class="bar" style="height:32px;width:32px"></div><div class="val">32</div><div class="lbl">8</div></div>
    <div class="item"><div class="bar" style="height:48px;width:48px"></div><div class="val">48</div><div class="lbl">12</div></div>
    <div class="item"><div class="bar" style="height:64px;width:64px"></div><div class="val">64</div><div class="lbl">16</div></div>
  </div>
</body>
</html>
