<!-- @dsCard group="Spacing" viewport="700x180" name="Corner Radii" subtitle="Soft, friendly geometry — pill buttons & rounded cards" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 28px; background: var(--bg-base); font-family: var(--font-body); }
  .row { display: flex; gap: 20px; }
  .item { text-align: center; }
  .box { width: 80px; height: 80px; background: var(--light-peach); border: 2px solid var(--peach); }
  .lbl { font-size: 13px; font-weight: 600; color: var(--text-strong); margin-top: 10px; }
  .sub { font-size: 12px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="lbl">sm · 8</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-md)"></div><div class="lbl">md · 12</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="lbl">lg · 16</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="lbl">xl · 24</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-pill)"></div><div class="lbl">pill · 999</div></div>
  </div>
</body>
</html>
